<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AFO — Advanced File Organizer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }

      .app-loader {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        z-index: 9999;
      }

      .app-loader .logo {
        width: 56px;
        height: 56px;
      }

      .app-loader .app-name {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: #1d1d1f;
        letter-spacing: 0.5px;
      }

      .progress-loader {
        width: 120px;
        height: 3px;
        border-radius: 7px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.06);
      }

      .progress-loader .bar {
        width: 1px;
        height: 100%;
        border-radius: 7px;
        background: #0071E3;
        animation: loading 3s cubic-bezier(0.4, 0.1, 0.4, 1) infinite;
      }

      @keyframes loading {
        0% { width: 0%; }
        50% { width: 100%; }
        100% { width: 0%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader" id="app-loader">
        <svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="10" fill="#0071E3"/>
          <path d="M24 12L16 24h6v12l8-12h-6V12z" fill="white"/>
        </svg>
        <div class="app-name">AFO</div>
        <div class="progress-loader"><div class="bar"></div></div>
      </div>
    </div>
    <script>
      // Hide loader after React mounts (minimum 800ms display)
      window.__AFO_LOADER_START = Date.now();
      window.__AFO_HIDE_LOADER = function() {
        var elapsed = Date.now() - window.__AFO_LOADER_START;
        var remaining = Math.max(0, 1500 - elapsed);
        setTimeout(function() {
          var loader = document.getElementById('app-loader');
          if (loader) {
            loader.style.transition = 'opacity 0.3s ease';
            loader.style.opacity = '0';
            setTimeout(function() { loader.remove(); }, 300);
          }
        }, remaining);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
